name: 한화엔진 사업부문 매출 엑셀

# 수동 실행 전용: Actions → "한화엔진 사업부문 매출 엑셀" → Run workflow
# → output/한화엔진_사업부문별_매출.xlsx 갱신 (DART 웹사이트, API 키 불필요)
on:
  workflow_dispatch:

permissions:
  contents: write   # 갱신된 xlsx·extracted.json 커밋·푸시

concurrency:
  group: hanwha-engine-segment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 사업부문 매출 엑셀 생성
        run: python dart_segment/run_segment.py

      - name: 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "output/한화엔진_사업부문별_매출.xlsx" dart_segment/extracted.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 한화엔진 사업부문 매출 엑셀 갱신 $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git push origin "HEAD:${GITHUB_REF_NAME}" && { echo "push 성공"; break; }
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
              sleep 3
            done
          fi
