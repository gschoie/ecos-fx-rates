name: Research Archive

on:
  schedule:
    # 매일 00:00 UTC = 한국시간 오전 9시
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        type: choice
        options: [daily, backfill, test]
        default: daily
      limit:
        description: "처리 건수 제한 (backfill/test용, 0=무제한)"
        default: "0"

concurrency:
  group: research-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research_archive/requirements.txt

      - name: Install dependencies
        run: pip install -r research_archive/requirements.txt

      - name: Run pipeline
        env:
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
          MASTER_INDEX_SHEET_ID: ${{ secrets.MASTER_INDEX_SHEET_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'daily' }}"
          LIMIT="${{ github.event.inputs.limit || '0' }}"
          case "$MODE" in
            daily)    python -m research_archive daily ;;
            backfill) python -m research_archive backfill --limit "$LIMIT" ;;
            test)     python -m research_archive test --limit "${LIMIT:-15}" ;;
          esac
