name: 커버리지 컨센서스 추이 이미지

# 수동 실행 전용: Actions → "커버리지 컨센서스 추이 이미지" → Run workflow
# FnGuide·네이버 컨센서스 시계열(최근 6개월) → output/consensus/*.png 갱신 (위클리용)
on:
  workflow_dispatch:

permissions:
  contents: write   # 갱신된 png 커밋·푸시

concurrency:
  group: consensus-chart
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 한글 폰트 설치
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-nanum
          rm -rf ~/.cache/matplotlib

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib pandas

      - name: 이미지 생성 (컨센 시계열 → png)
        run: python consensus/weekly_consensus_chart.py

      - name: 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/consensus
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 컨센서스 추이 이미지 갱신 $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git push origin HEAD:main && { echo "push 성공"; break; }
              git pull --rebase --autostash origin main || exit 1
              sleep 3
            done
          fi
