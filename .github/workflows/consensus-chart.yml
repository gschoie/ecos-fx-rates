name: 커버리지 컨센서스 추이 이미지

# FnGuide·네이버 컨센서스 시계열(최근 6개월) → output/consensus/*.png|svg 갱신 (위클리용)
#   - 매일 16:50 KST(07:50 UTC) 자동 — 11/9 사용자: 주보 데이터 4종은 장 마감 후 매일 한 번. 정시는 GS-DB2 쪽
#     Claude 예약 작업(평일 16:42 KST, dispatch)이 맡고 이 크론은 안전망(무료 러너 크론은 몇 시간 밀릴 수 있다).
#   - 수동: Actions → "커버리지 컨센서스 추이 이미지" → Run workflow, 또는 대시보드 컨센서스 갤러리의 🔄 버튼.
on:
  workflow_dispatch:
  schedule:
    - cron: "50 7 * * *"    # 16:50 KST 매일

permissions:
  contents: write   # 갱신된 png 커밋·푸시

concurrency:
  group: consensus-chart
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 한글 폰트 설치
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-nanum fonts-nanum-extra   # extra = 나눔스퀘어 Light
          rm -rf ~/.cache/matplotlib

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib pandas

      - name: 이미지 생성 (컨센 시계열 → png)
        run: python consensus/weekly_consensus_chart.py

      - name: 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/consensus
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 컨센서스 추이 이미지 갱신 $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git push origin HEAD:main && { echo "push 성공"; break; }
              git pull --rebase --autostash origin main || exit 1
              sleep 3
            done
          fi
