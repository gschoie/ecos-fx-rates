name: 피어그룹 주가 엑셀

# 야후 수집 → ① 피어그룹 주가 엑셀 ② 위클리용 주가흐름표 PNG/SVG ③ 조선주 INDEX 차트 PNG/SVG
# 를 한 번에 만들어 output/ 에 커밋한다(저장소·대시보드에서 바로 내려받기).
#   - 매일 16:40 KST(07:40 UTC) 자동 — 11/9 사용자: 주보 데이터 4종(피어그룹 주가변동표·INDEX·수급 그림·
#     컨센서스)은 "장 끝나고 매일 한 번 4시반~5시". 한국 종가는 당일, 미국·유럽은 전일 종가가 실린다
#     (주말에도 돌아 금요일 미국 종가는 토요일 run 이 담는다). 무료 러너 크론은 몇십 분~몇 시간 밀릴 수 있어
#     정시는 GS-DB2 쪽 Claude 예약 작업(평일 16:42 KST, 이 워크플로 dispatch)이 맡고 이 크론은 안전망.
#   - 수동: Actions → Run workflow, 또는 대시보드 갤러리 페이지의 '🔄 지금 갱신' 버튼
#     (GAS dispatch_proxy 의 `peer` 키 = 이 파일).
on:
  workflow_dispatch:
  schedule:
    - cron: "40 7 * * *"    # 16:40 KST 매일 (11/9: 07:10 → 16:40, 장 마감 후)

permissions:
  contents: write   # 갱신된 xlsx·png·svg 커밋·푸시

concurrency:
  group: peergroup-price
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 한글 폰트 설치 (이미지용 나눔고딕)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-nanum
          rm -rf ~/.cache/matplotlib

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r peergroup/requirements.txt

      - name: ① 피어그룹 엑셀 생성 (야후 수집 → xlsx)
        run: python peergroup/weekly_peergroup_price.py

      - name: ② 피어그룹 주가흐름표 이미지 (png/svg) — 조선·해운
        run: python peergroup/weekly_peer_price_image.py

      - name: ②-2 방산·항공우주 주가흐름표 (output/peer_price_defense)
        run: python peergroup/weekly_peer_price_image.py --universe defense

      - name: ②-3 건설기계 주가흐름표 (output/peer_price_construction)
        run: python peergroup/weekly_peer_price_image.py --universe construction

      - name: ③ 조선주 INDEX 차트 4종 (png/svg)
        run: python peergroup/weekly_peer_index_image.py

      - name: ③-2 방산 INDEX 차트 4종 (png/svg → output/peer_price_defense)
        run: python peergroup/weekly_defense_index_image.py

      - name: 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "output/글로벌_주가_변동률_모니터링_최종.xlsx" output/peer_price output/peer_price_defense output/peer_price_construction
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 피어그룹 엑셀·이미지 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d\ %H:%M)"
            for i in 1 2 3; do
              git push origin HEAD:main && { echo "push 성공"; break; }
              git pull --rebase --autostash origin main || exit 1
              sleep 3
            done
          fi
